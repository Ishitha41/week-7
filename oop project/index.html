<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Learn-E-Fy</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- Left Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">📘</div>
        <div class="brand-title">Learn-E-Fy</div>
      </div>

      <nav class="nav">
        <ul>
          <li class="nav-item active" data-page="dashboard">🏠 Dashboard</li>
          <li class="nav-item" data-page="modules">📚 Modules</li>
          <li class="nav-item" data-page="tasks">📝 Tasks</li>
          <li class="nav-item" data-page="profile">👤 Profile</li>
        </ul>
      </nav>

      <div class="sidebar-footer">
        <div class="user-mini">
          <div class="avatar">A</div>
          <div>
            <div id="miniName">Alex</div>
            <div class="mini-sub">Level 5 • 1,250 XP</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main area -->
    <main class="main">
      <header class="topbar">
        <div class="top-left">
          <h1 id="pageTitle">Dashboard</h1>
        </div>
        <div class="top-right">
          <div id="topUser">Alex • 1250 XP</div>
        </div>
      </header>

      <div id="content" class="content">
        <!-- Dashboard initially loaded by script -->
      </div>
    </main>

    <!-- Right subject panel (for Modules -> subject details) -->
    <aside id="subjectPanel" class="subject-panel hidden">
      <div class="subject-header">
        <div>
          <div id="subjectIcon" class="subject-icon">🧠</div>
          <div id="subjectTitle" class="subject-title">Subject</div>
        </div>
        <button class="close-subject" onclick="closeSubjectPanel()">✖</button>
      </div>

      <div class="subject-sidebar">
        <ul>
          <li class="subject-nav active" data-tab="videos">🎥 Videos</li>
          <li class="subject-nav" data-tab="notes">📘 Notes</li>
          <li class="subject-nav" data-tab="quizzes">🧠 Quizzes</li>
          <li class="subject-nav" data-tab="rewards">🏅 Rewards</li>
          <li class="subject-nav" data-tab="games">🎮 Games</li>
        </ul>
      </div>

      <div id="subjectContent" class="subject-content">
        <!-- Subject content placeholders -->
      </div>
    </aside>
  </div>

  <!-- Quiz Modal -->
  <div id="quizModal" class="modal hidden">
    <div class="modal-box">
      <button class="modal-close" onclick="closeQuiz()">✖</button>
      <h2 id="quizModalTitle">Quiz</h2>
      <div id="quizQ" class="quiz-question">Question text</div>
      <div id="quizOptions" class="quiz-options"></div>
      <div id="quizFeedback" class="quiz-feedback"></div>
      <div class="quiz-controls">
        <button onclick="prevQuizQuestion()">⬅ Prev</button>
        <button onclick="nextQuizQuestion()">Next ➡</button>
      </div>
    </div>
  </div>

  <!-- Confetti container -->
  <div id="confetti"></div>

  <script src="script.js"></script>
</body>
</html>
